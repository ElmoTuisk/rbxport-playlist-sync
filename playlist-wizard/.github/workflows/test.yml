name: Playlist Wizard tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: node scripts/Install-Essentia.mjs
      - run: node --test test/*.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify the one-file JavaScript setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag and package version must match.' }
          if (Test-Path manifest.json) { if ((Get-Content manifest.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Manifest version mismatch.' } }
          $folder = Join-Path $env:RUNNER_TEMP 'candidate'
          New-Item -ItemType Directory -Path $folder | Out-Null
          $setupName = "playlist-wizard-$version-windows-setup.mjs"
          node scripts/Build-JavaScript-Installer.mjs --destination (Join-Path $folder $setupName)
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript setup build failed.' }
          node (Join-Path $folder $setupName) --verify
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript setup verification failed.' }
          $sourceName = "playlist-wizard-$version-source.zip"
          & ./Package-Addon.ps1 -Destination (Join-Path $folder $sourceName)
          $lines = foreach ($name in @($setupName,$sourceName)) { (Get-FileHash -LiteralPath (Join-Path $folder $name) -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $name }
          $lines | Set-Content (Join-Path $folder 'SHA256SUMS.txt') -Encoding utf8
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') | Where-Object { $_.StartsWith($version + ' ') } | Select-Object -First 1
          if (-not $notes) { throw 'Missing release notes.' }
          ("Requires official Node.js 24 or newer, Windows x64 and compatible rbxport. Download the .mjs setup, then run: node $setupName`n`n" + $notes.Trim()) | Set-Content (Join-Path $folder 'release-notes.md') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Publish after Windows and Linux tests pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $folder = Join-Path $env:RUNNER_TEMP 'candidate'
          gh release create $env:GITHUB_REF_NAME (Join-Path $folder "playlist-wizard-$version-windows-setup.mjs") (Join-Path $folder "playlist-wizard-$version-source.zip") (Join-Path $folder 'SHA256SUMS.txt') --verify-tag --title ('v' + $version) --notes-file (Join-Path $folder 'release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
