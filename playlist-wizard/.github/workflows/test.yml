name: Playlist Wizard tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: node scripts/Install-Essentia.mjs
      - run: node --test test/*.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package and publish the tested tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag and package version must match' }
          $name = 'playlist-wizard-' + $version + '-windows-setup.zip'
          $package = Join-Path $env:RUNNER_TEMP $name
          & ./Package-Addon.ps1 -Destination $package
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName -match '(?i)(\.local-data|\.tools|\.runtime|\.sqlite|\.dpapi|launch-url|cookies|installed\.json|\.(mp3|m4a|flac|opus|wav|tgz|wasm|cjs|exe|dll)$)') { throw 'Private or compiled-runtime package entry refused' }
            }
          } finally { $archive.Dispose() }
          $checksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          ((Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $name) | Set-Content $checksums -Encoding utf8
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') | Where-Object { $_.StartsWith($version + ' ') } | Select-Object -First 1
          if (-not $notes) { throw 'Missing changelog entry' }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes.Trim() | Set-Content $notesFile -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $package $checksums --verify-tag --title ('v' + $version) --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
