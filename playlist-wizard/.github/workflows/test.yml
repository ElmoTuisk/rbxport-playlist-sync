name: Playlist Wizard tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: node scripts/Install-Essentia.mjs
      - run: node --test test/*.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    environment: code-signing
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      setup_sha256: ${{ steps.verify.outputs.setup_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check trusted publisher configuration and prepare signing input
        id: prepare
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_POLICY }}
          SIGNPATH_PAYLOAD_CONFIGURATION: ${{ vars.SIGNPATH_PAYLOAD_CONFIGURATION }}
          SIGNPATH_SETUP_CONFIGURATION: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ReleaseTrust.ps1
          $null = Get-RbxportReleasePolicy $PWD.Path
          foreach ($name in @('SIGNPATH_ORGANIZATION','SIGNPATH_PROJECT','SIGNPATH_POLICY','SIGNPATH_PAYLOAD_CONFIGURATION','SIGNPATH_SETUP_CONFIGURATION','SIGNPATH_API_TOKEN')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw ('Trusted signing is not configured: ' + $name + '. Nothing will be published.') }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag and package version must match' }
          if (Test-Path manifest.json) { if ((Get-Content manifest.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Manifest and package version must match' } }
          'version=' + $version >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/candidate" | Out-Null
          & ./Package-Addon.ps1 -Destination "$env:RUNNER_TEMP/candidate/playlist-wizard-$version-source.zip"
          & ./Build-ReleasePayload.ps1 -Destination "$env:RUNNER_TEMP/payload"
      - uses: actions/upload-artifact@v4
        id: payload
        with:
          name: unsigned-payload-for-signing
          path: ${{ runner.temp }}/payload/
          include-hidden-files: true
          retention-days: 7
      # Pin the reviewed provider action; no signing credentials are exposed to PR/test jobs.
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PAYLOAD_CONFIGURATION }}
          github-artifact-id: ${{ steps.payload.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-payload
      - name: Build the outer setup from verified signed scripts and launcher
        shell: pwsh
        run: |
          & ./Build-Installer.ps1 -PayloadDirectory "$env:RUNNER_TEMP/signed-payload" -Destination "$env:RUNNER_TEMP/unsigned-setup/playlist-wizard-${{ steps.prepare.outputs.version }}-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        id: setup
        with:
          name: unsigned-setup-for-signing
          path: ${{ runner.temp }}/unsigned-setup/
          retention-days: 7
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION }}
          project-slug: ${{ vars.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION }}
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.prepare.outputs.version) }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-setup
      - name: Verify the signed candidate and write final checksums
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ReleaseTrust.ps1
          $policy = Get-RbxportReleasePolicy $PWD.Path
          $version = '${{ steps.prepare.outputs.version }}'
          $name = "playlist-wizard-$version-windows-setup.exe"
          $setup = Join-Path "$env:RUNNER_TEMP/signed-setup" $name
          Assert-RbxportTrustedFile $setup $policy.publisherSubjects[0]
          $check = Start-Process -FilePath $setup -ArgumentList '--verify-payload' -WindowStyle Hidden -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw 'Signed setup payload verification failed.' }
          Copy-Item -LiteralPath $setup -Destination "$env:RUNNER_TEMP/candidate"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          'setup_sha256=' + $hash >> $env:GITHUB_OUTPUT
          $sourceName = "playlist-wizard-$version-source.zip"
          $sourceHash = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/candidate/$sourceName" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash  $name", "$sourceHash  $sourceName") | Set-Content "$env:RUNNER_TEMP/candidate/SHA256SUMS.txt" -Encoding utf8
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') | Where-Object { $_.StartsWith($version + ' ') } | Select-Object -First 1
          if (-not $notes) { throw 'Missing changelog entry.' }
          $notes.Trim() | Set-Content "$env:RUNNER_TEMP/candidate/release-notes.md" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
  publish:
    needs: release
    runs-on: windows-latest
    environment: verified-windows-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate
      - name: Publish only the exact setup validated with Smart App Control enabled
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SAC_VALIDATED_SETUP_SHA256: ${{ vars.SAC_VALIDATED_SETUP_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.release.outputs.version }}'
          $setup = "candidate/playlist-wizard-$version-windows-setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '${{ needs.release.outputs.setup_sha256 }}' -or $env:SAC_VALIDATED_SETUP_SHA256 -cne $hash) { throw 'This exact signed setup needs the documented Smart App Control / install / reopen / uninstall validation before publication.' }
          gh release create $env:GITHUB_REF_NAME $setup "candidate/playlist-wizard-$version-source.zip" candidate/SHA256SUMS.txt --verify-tag --title ('v' + $version) --notes-file candidate/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
